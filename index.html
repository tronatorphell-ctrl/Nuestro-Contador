<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>

<div class="contenido">

    <h1>❤️ Nuestra Historia ❤️</h1>

    <p class="fecha">
        Desde el 24 de abril de 2026<br>
        8:10 PM
    </p>

    <div id="contador">

        <div class="caja">
            <span id="dias">0</span>
            <p>Días</p>
        </div>

        <div class="caja">
            <span id="horas">0</span>
            <p>Horas</p>
        </div>

        <div class="caja">
            <span id="minutos">0</span>
            <p>Minutos</p>
        </div>

        <div class="caja">
            <span id="segundos">0</span>
            <p>Segundos</p>
        </div>

    </div>

    <button id="musica">
        ❤️ Reproducir canción
    </button>

    <audio id="audio" src="musica.mp3"></audio>

</div>

<script src="script.js"></script>

</body>
</html>
